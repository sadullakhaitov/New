<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Emir Food</title>
<meta name="theme-color" content="#121110">
<link rel="icon" href="static/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="static/img/logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css">
<script>
  // Mavzuni sahifa chizilishidan oldin qo'yish (oq/qora miltillamasligi uchun)
  try {
    var t = JSON.parse(localStorage.getItem('ef_theme') || 'null');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://kit.fontawesome.com/87f4671556.js" crossorigin="anonymous"></script>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="splash">
    <img src="static/img/logo.webp" alt="Emir Food" width="150" height="150">
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
</main>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="assertive"></div>
<script src="static/i18n.js"></script>
<script src="static/app.js"></script>
</body>
</html>
